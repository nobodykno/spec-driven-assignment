# Local stack (NFR-OPS-001). Credentials are local-development values (SDS §12.3), not secrets.
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tracker
    ports:
      - '5433:5432'
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d tracker']
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: '4001'
      DATABASE_URL: postgresql://dev:dev@postgres:5432/tracker
      JWT_SECRET: ${JWT_SECRET:?required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health']
      interval: 5s
      timeout: 3s
      retries: 10

  tracker:
    build:
      context: .
      dockerfile: services/tracker/Dockerfile
    environment:
      PORT: '4002'
      DATABASE_URL: postgresql://dev:dev@postgres:5432/tracker
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4002/health']
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: '4000'
      AUTH_SERVICE_URL: http://auth:4001
      TRACKER_SERVICE_URL: http://tracker:4002
      WEB_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?required}
    ports:
      - '4000:4000'
    depends_on:
      - auth
      - tracker
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - api-gateway

volumes:
  tracker_pgdata:
