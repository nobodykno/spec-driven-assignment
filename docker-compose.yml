# Local stack (NFR-OPS-001). Credentials are local-development values (SDS §12.3), not secrets.
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tracker
    ports:
      - "5433:5432"
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tracker_pgdata:
