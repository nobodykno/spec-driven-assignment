schema: spec-driven

context: |
  Project: Team Task Tracker (spec-driven-assignment), pnpm microservices monorepo.
  Package manager: pnpm workspaces only. Never use npm or yarn. No "latest" versions; pin exact versions.
  Node.js 22, TypeScript strict; Node packages extend tsconfig.base.json.

  Source documents (read before planning any change):
    - docs/FRS.md  functional requirements with IDs (FR-AUTH-001, FR-TASK-005, ...)
    - docs/SDS.md  architecture, data model, API, security, testing design

  Structure:
    - apps/web              React 19 + Vite + Tailwind + shadcn/ui + TanStack Query
    - services/api-gateway  Express 5, port 4000, only public entry; verifies JWT, proxies to services
    - services/auth         Express 5, port 4001; register, login, refresh, logout, me
    - services/tracker      Express 5, port 4002; projects, members, tasks, comments, activity
    - packages/database     Sequelize + PostgreSQL 16; models, migrations, seeders (ONLY package using sequelize)
    - packages/shared       Zod schemas, TS types, error codes, OpenAPI 3.1 registry

  Database: PostgreSQL 16 in Docker Compose on host port 5433.
  API: REST under /api/v1; errors { error: { code, message, details? } }; lists { items, meta }.
  Testing: Vitest + Supertest (services), Vitest + RTL (web), Playwright (e2e).
  Issue tracker: Jira keys DEV-1 ... DEV-21 (assignment IDs DEV-1001 ... DEV-1018, map in docs/mcp-setup.md). Tickets are fetched live via the Atlassian MCP; never invented.
  Quality gates: pnpm build, pnpm lint, pnpm typecheck, pnpm test.

rules:
  proposal:
    - "Start with the Ticket section: Jira key, summary, status, acceptance criteria and blockers (all Done), fetched live via MCP (.claude/rules/propose-artifacts.md)"
    - List the FRS requirement IDs covered and the SDS sections followed or changed (workflow tickets: trace to the ticket's acceptance criteria)
    - Include an Open decisions table; none may stay Open before specs are written (.claude/rules/open-decisions.md)
    - List the affected packages/services using the layer tags in .claude/rules/layout.md
    - List every new dependency with exact version and reason, or state "None"
    - List database changes (tables, columns, indexes, migrations), or state "No schema change"
    - Include impact, rollback plan and what is out of scope
  specs:
    - Use WHEN/THEN scenarios with SHALL/MUST wording, derived from FRS acceptance criteria
    - "Every scenario title ends with its FRS ID in brackets, e.g. 'Wrong password rejected [FR-AUTH-002]'; its test title is 'FR-AUTH-002: Wrong password rejected'"
    - Every requirement has a success scenario and at least one failure scenario
    - Endpoints touching projects/tasks include a non-member (404) and wrong-role (403) scenario, plus unauthenticated (401) and validation-failure (400)
    - Use ADDED/MODIFIED/REMOVED/RENAMED; for MODIFIED copy the full current requirement and keep its title
  design:
    - Reference the SDS sections followed (e.g. "Follows SDS 7.2"); if the design differs, state the difference and list the SDS update
    - Define Zod schemas in packages/shared before service or web code (contract first)
    - Record library APIs checked with Context7 MCP (library, version, topic) under "Docs checked", or why it was unavailable
  tasks:
    - Write tests before implementation; test titles start with the FRS ID
    - Group tasks by layer tag (shared, database, auth, tracker, gateway, web, e2e, docker, docs) so they can run in parallel worktrees; mark them [PARALLEL]
    - Size each task at about 1 to 2 hours of agent work, one commit per task
    - Map every spec scenario to exactly one named test task (Scenario to test map)
    - End every task group, database groups included, with the full checkpoint in .claude/rules/checkpoint.md; results go to review.md
    - Every change carries a delta-openapi.yaml (empty paths when no endpoint changes)

operations:
  apply:
    guidance:
      - Failing test first, then code, then checkpoint; stage one task and commit only after the user replies commit
      - Verify library APIs with Context7 and pin exact versions
  archive:
    guidance:
      - Run only after the PR is merged and the change has been synced, on a follow-up branch (never on main)
